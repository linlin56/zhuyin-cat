<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdfbf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1a18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ZhuyinCat">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ZhuyinCat</title>
  <meta name="description" content="ZhuyinCat: learn to type zhuyin (bopomofo) on the standard Taiwanese layout.">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/speed.css">
  <link rel="stylesheet" href="css/small-screens.css">
  <!-- Colour mode before the page is drawn, so that it never flashes in the wrong colours -->
  <script>
    (function () {
      let theme = 'system';
      try { theme = (JSON.parse(localStorage.getItem('zhuyincat-v1')) || {}).theme || 'system'; } catch (e) {}
      if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.bsTheme = theme;
    })();
  </script>
</head>
<body>
  <header class="container d-flex flex-wrap align-items-center gap-2 gap-md-3 py-3">
    <a href="#" class="text-reset text-decoration-none me-auto" data-nav="home">
      <span class="h4 fw-bold m-0 text-nowrap" data-i18n="appName">ZhuyinCat</span>
    </a>
    <nav class="nav nav-pills flex-nowrap">
      <button type="button" class="nav-link text-nowrap py-1 px-2 px-md-3" data-nav="home" data-i18n="navMap"></button>
      <button type="button" class="nav-link text-nowrap py-1 px-2 px-md-3" data-nav="speed" data-i18n="navSpeed"></button>
      <button type="button" class="nav-link text-nowrap py-1 px-2 px-md-3" data-nav="settings" data-i18n="navSettings"></button>
    </nav>
    <div class="d-flex align-items-center gap-1">
      <div class="btn-group btn-group-sm zc-langs" role="group">
        <button type="button" class="btn btn-outline-secondary" data-lang="fr">FR</button>
        <button type="button" class="btn btn-outline-secondary" data-lang="en">EN</button>
        <button type="button" class="btn btn-outline-secondary" data-lang="zh">中</button>
      </div>
      <button type="button" class="btn btn-link link-body-emphasis px-1" data-theme-toggle>
        <i class="bi bi-moon-stars" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="container pb-4">
    <section id="screen-home" class="zc-screen"></section>
    <section id="screen-lesson" class="zc-screen"></section>
    <section id="screen-results" class="zc-screen"></section>
    <section id="screen-speed" class="zc-screen"></section>
    <section id="screen-settings" class="zc-screen"></section>
  </main>

  <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content"></div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" id="toasts"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/i18n/fr.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/zh.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui/keyboard.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/lesson.js"></script>
  <script src="js/screens/results.js"></script>
  <script src="js/screens/speed.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
