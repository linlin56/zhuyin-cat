# Publishes the game on GitHub Pages at every push to main (or by hand from the Actions tab).
# The site is static: no build, the game's files are copied as they are.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a waiting one, a running one is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the files the game needs, not the README, the licence or the workflows.
      - name: Gather the site
        run: |
          mkdir _site
          cp -R index.html manifest.webmanifest css js icons vendor _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
